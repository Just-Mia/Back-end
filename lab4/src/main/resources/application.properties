spring.application.name=printershop


server.port=8080


spring.datasource.url=jdbc:postgresql://localhost:5435/psDatabase?gmtZoneConversionOverride=UTC
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.docker.compose.enabled=false
spring.jpa.hibernate.ddl-auto=none

spring.security.oauth2.client.registration.keycloak.client-id=backend-app
spring.security.oauth2.client.registration.keycloak.client-authentication-method=none
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile

spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8081/realms/course-realm
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/course-realm

spring.liquibase.change-log=db/changelog/changelog-master.xml
#spring.liquibase.clear-checksums=true